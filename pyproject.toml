[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fennec-x-code"
version = "0.1.0"
description = "Fennec X Code: restricted local single-agent foundation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fennec-x-code = "sca.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["sca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
